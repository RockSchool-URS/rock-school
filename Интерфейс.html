  <style>
    :root {
      --bg-black: #07070a;
      --card-bg: rgba(14, 14, 19, 0.86);
      --rock-red: #e11d48;
      --rock-red-bright: #ff1e42;
      --rock-red-dark: #9f1239;
      --btn-blue: #2563eb;
      --btn-blue-hover: #3b82f6;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-black);
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* --- ФИРМЕННЫЙ ФОН ШКОЛЫ РОКА --- */
    .stage-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: #07070a;
      background-image:
        radial-gradient(circle at center, rgba(10, 10, 14, 0.35) 0%, rgba(5, 5, 8, 0.72) 100%),
        var(--rock-bg, radial-gradient(circle at 20% 20%, rgba(225, 29, 72, 0.25), #07070a 70%));
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    @media (min-aspect-ratio: 1/1) {
      .stage-bg {
        background-image:
          radial-gradient(circle at center, rgba(8, 8, 12, 0.72) 0%, rgba(5, 5, 8, 0.92) 100%),
          var(--rock-bg, none);
        background-size: cover;
        background-position: center;
      }
      .stage-bg::before,
      .stage-bg::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 44vw;
        background-image: var(--rock-bg, none);
        background-size: auto 100vh;
        background-repeat: no-repeat;
        opacity: 0.95;
      }
      .stage-bg::before {
        left: 0;
        background-position: left center;
        -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 52%, rgba(0,0,0,0) 100%);
        mask-image: linear-gradient(to right, rgba(0,0,0,1) 52%, rgba(0,0,0,0) 100%);
      }
      .stage-bg::after {
        right: 0;
        background-position: right center;
        -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 52%, rgba(0,0,0,0) 100%);
        mask-image: linear-gradient(to left, rgba(0,0,0,1) 52%, rgba(0,0,0,0) 100%);
      }
    }

    /* --- ЗАГРУЗОЧНЫЙ ЭКРАН С ЛОГОТИПОМ --- */
    .preloader {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: radial-gradient(circle at center, rgba(18, 18, 24, 0.94) 0%, rgba(6, 6, 9, 0.98) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring-wrap {
      position: relative;
      width: 168px;
      height: 168px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: var(--rock-red-bright);
      border-right-color: rgba(225, 29, 72, 0.45);
      box-shadow: 0 0 24px rgba(225, 29, 72, 0.35);
      animation: spinRing 1.15s linear infinite;
    }

    .loader-logo {
      width: 142px;
      height: 142px;
      border-radius: 50%;
      background-color: #111116;
      background-image: var(--rock-logo, none);
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 30px rgba(225, 29, 72, 0.45);
      animation: pulseLogo 1.8s ease-in-out infinite;
    }

    .loader-text {
      margin-top: 22px;
      font-family: 'Russo One', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e4e4e7;
      text-shadow: 0 0 12px rgba(225, 29, 72, 0.5);
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(0.97); }
      50% { transform: scale(1.03); }
    }

    /* --- СТРАНИЦА 1: ЭКРАН ВХОДА --- */
    .login-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      width: 100%;
      max-width: 420px;
      padding: 34px 30px 30px;
      border-radius: 18px;
      border: 1px solid rgba(225, 29, 72, 0.38);
      box-shadow:
        0 25px 55px rgba(0, 0, 0, 0.85),
        0 0 40px rgba(225, 29, 72, 0.16);
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #881337, var(--rock-red-bright), #881337);
      box-shadow: 0 0 16px var(--rock-red-bright);
    }

    .card-logo {
      width: 128px;
      height: 128px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background-color: #121217;
      background-image: var(--rock-logo, none);
      background-size: cover;
      background-position: center;
      border: 2px solid rgba(225, 29, 72, 0.5);
      box-shadow: 0 0 25px rgba(225, 29, 72, 0.35);
    }

    .login-subtitle {
      margin: 0 0 24px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #d4d4d8;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #d4d4d8;
    }

    .select-wrap {
      position: relative;
    }

    select {
      width: 100%;
      padding: 13px 38px 13px 14px;
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      background-color: rgba(15, 15, 21, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    select:hover:not(:disabled) {
      border-color: rgba(255, 30, 66, 0.7);
      background-color: #16161f;
    }

    select:focus {
      border-color: var(--rock-red-bright);
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.25);
    }

    select:disabled {
      color: #71717a;
      border-color: rgba(255, 255, 255, 0.08);
      cursor: not-allowed;
    }

    select option {
      background-color: #14141b;
      color: #ffffff;
    }

    .select-wrap::after {
      content: "";
      position: absolute;
      right: 14px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--rock-red-bright);
      border-bottom: 2px solid var(--rock-red-bright);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    /* СИНЯЯ КНОПКА ВХОДА */
    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border: 1px solid rgba(96, 165, 250, 0.4);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    }

    .btn-login:hover:not(:disabled) {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      box-shadow: 0 8px 26px rgba(59, 130, 246, 0.65);
      transform: translateY(-1px);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      background: #23232b;
      border-color: rgba(255, 255, 255, 0.08);
      color: #71717a;
      box-shadow: none;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      color: #fb7185;
      min-height: 18px;
    }

    /* --- СТРАНИЦА 2: ОСНОВНОЙ ЭКРАН (ПОКА ПУСТОЙ) --- */
    .app-wrapper {
      position: relative;
      z-index: 1;
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }

    .topbar {
      background: rgba(11, 11, 16, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--rock-red);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Russo One', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .topbar-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #14141b;
      background-image: var(--rock-logo, none);
      background-size: cover;
      background-position: center;
      border: 1.5px solid var(--rock-red-bright);
      box-shadow: 0 0 10px rgba(225, 29, 72, 0.4);
      flex-shrink: 0;
    }

    .topbar-brand span {
      color: var(--rock-red-bright);
    }

    .session-info {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .session-badge {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(225, 29, 72, 0.38);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #d4d4d8;
    }

    .session-badge strong {
      color: #ffffff;
      margin-left: 4px;
    }

    .btn-logout {
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #ffffff;
      background: linear-gradient(135deg, var(--rock-red) 0%, var(--rock-red-dark) 100%);
      border: 1px solid rgba(251, 113, 133, 0.35);
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    }

    .btn-logout:hover {
      filter: brightness(1.12);
      box-shadow: 0 6px 18px rgba(225, 29, 72, 0.55);
      transform: translateY(-1px);
    }

    .workspace {
      flex: 1;
      padding: 28px 24px;
    }
  </style>
</head>
<body>

  <div class="stage-bg"></div>

  <div id="preloader" class="preloader">
    <div class="loader-ring-wrap">
      <div class="loader-ring"></div>
      <div class="loader-logo"></div>
    </div>
    <div id="loaderText" class="loader-text">Загрузка справочника...</div>
  </div>

  <!-- СТРАНИЦА 1: ВХОД -->
  <div id="loginScreen" class="login-wrapper">
    <div class="login-card">
      <div class="card-logo" title="Школа рока Underground Rock School"></div>
      <p class="login-subtitle">Панель администратора</p>

      <div class="form-group">
        <label for="citySelect">Город филиала</label>
        <div class="select-wrap">
          <select id="citySelect" onchange="handleCityChange()" disabled>
            <option value="">Загрузка...</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="adminSelect">Администратор</label>
        <div class="select-wrap">
          <select id="adminSelect" onchange="updateLoginButtonState()" disabled>
            <option value="">Сначала выберите город</option>
          </select>
        </div>
      </div>

      <button id="loginBtn" class="btn-login" onclick="handleLogin()" disabled>
        Войти в систему
      </button>

      <div id="statusMsg" class="status-msg"></div>
    </div>
  </div>

  <!-- СТРАНИЦА 2: РАБОЧАЯ ОБЛАСТЬ -->
  <div id="mainScreen" class="app-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-brand">
          <div class="topbar-logo"></div>
          <div>Школа <span>Рока</span></div>
        </div>
        <div class="session-info">
          <span class="session-badge">Город: <strong id="currentCityDisplay"></strong></span>
          <span class="session-badge">Администратор: <strong id="currentAdminDisplay"></strong></span>
        </div>
      </div>
      <button class="btn-logout" onclick="handleLogout()">Выйти</button>
    </header>

    <main class="workspace">
      <!-- Сюда добавим разделы "Заявка", "Пробное" и т.д. -->
    </main>
  </div>

  <script>
    // =========================================================================
    // ССЫЛКА ВАШЕГО РАЗВЁРТЫВАНИЯ APPS SCRIPT (та, что заканчивается на /exec)
    // Кодировку и лишние хвосты вида &utf=1 скрипт исправляет автоматически.
    // =========================================================================
    const API_URL_RAW = 'https://script.google.com/macros/s/AKfycbzYNgLL4zEikzB2ssoNRwjPDIbF0TRyQrDxDUO9-jy1Kpql8i0vcYOtVD-zFUPCjazTRA/exec';

    // Приводит ссылку в порядок: раскодирует %2F, убирает &utf=1 и мусор вокруг
    function normalizeApiUrl(raw) {
      let u = String(raw || '').trim().replace(/^["']|["']$/g, '');
      try {
        u = decodeURIComponent(u);
      } catch (e) {}
      u = u.replace(/&?utf=1/gi, '').replace(/%2F/gi, '/');
      const m = u.match(/https?:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/(exec|dev)/);
      return m ? m[0] : u;
    }

    const API_URL = normalizeApiUrl(API_URL_RAW);

    const SESSION_KEY = 'rock_school_admin_session';

    let currentSession = {
      city: '',
      admin: ''
    };

    let loginDictionary = {
      cities: [],
      adminsByCity: {}
    };

    window.onload = function() {
      const saved = localStorage.getItem(SESSION_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.city && parsed.admin) {
            currentSession = parsed;
            openMainScreen();
          }
        } catch (e) {
          localStorage.removeItem(SESSION_KEY);
        }
      }

      loadDictionary();
    };

    // Запрос к Google Таблице БЕЗ куки Google (обходит конфликт нескольких аккаунтов)
    async function callApi(action, payload = {}) {
      if (!API_URL || API_URL.indexOf('http') !== 0) {
        throw new Error('В константе API_URL_RAW укажите ссылку развёртывания, заканчивающуюся на /exec');
      }

      // Способ 1: POST — основной
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          credentials: 'omit',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, payload: payload })
        });
        const text = await response.text();
        const json = JSON.parse(text);
        if (!json.ok) throw new Error(json.error || 'Ошибка сервера таблицы');
        return json.data;
      } catch (err) {
        // Способ 2: GET — резервный, если POST заблокирован браузером
        const qs = new URLSearchParams({ action: action });
        if (payload && payload.sheetName) qs.set('sheetName', payload.sheetName);
        if (payload && payload.cityName) qs.set('cityName', payload.cityName);

        const response2 = await fetch(API_URL + '?' + qs.toString(), {
          method: 'GET',
          credentials: 'omit',
          redirect: 'follow'
        });
        const text2 = await response2.text();

        let json2 = null;
        try {
          json2 = JSON.parse(text2);
        } catch (e) {
          // Сервер вернул HTML-страницу вместо данных — значит развёрнута СТАРАЯ версия кода
          if (/<html|<!doctype/i.test(text2)) {
            throw new Error(
              'Сервер вернул страницу вместо данных. Обновите код файла Интерфейс.gs ' +
              'и разверните НОВУЮ ВЕРСИЮ (Управление развертываниями → карандаш → Версия: Новая версия → Развернуть).'
            );
          }
          throw new Error('Ответ сервера не распознан. Проверьте, что ссылка оканчивается на /exec.');
        }

        if (!json2.ok) throw new Error(json2.error || 'Ошибка сервера таблицы');
        return json2.data;
      }
    }

    function showLoader(message) {
      document.getElementById('loaderText').textContent = message || 'Загрузка...';
      document.getElementById('preloader').classList.remove('hidden');
    }

    function hideLoader() {
      document.getElementById('preloader').classList.add('hidden');
    }

    async function loadDictionary() {
      showLoader('Загрузка справочника...');
      try {
        const data = await callApi('getLoginOptions');
        loginDictionary = data || { cities: [], adminsByCity: {} };

        populateSelect('citySelect', loginDictionary.cities, 'Выберите город');
        resetAdminSelect('Сначала выберите город');

        if (loginDictionary.cities.length === 0) {
          document.getElementById('statusMsg').textContent =
            'На листе «Справочник» не найден список городов.';
        } else {
          document.getElementById('statusMsg').textContent = '';
        }
      } catch (err) {
        document.getElementById('statusMsg').textContent = 'Ошибка: ' + err.message;
      } finally {
        hideLoader();
      }
    }

    function handleCityChange() {
      const selectedCity = document.getElementById('citySelect').value;
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.textContent = '';

      if (!selectedCity) {
        resetAdminSelect('Сначала выберите город');
        updateLoginButtonState();
        return;
      }

      const admins = (loginDictionary.adminsByCity && loginDictionary.adminsByCity[selectedCity]) || [];
      if (admins.length > 0) {
        populateSelect('adminSelect', admins, 'Выберите администратора');
      } else {
        resetAdminSelect('Нет администраторов для выбранного города');
        statusMsg.textContent = 'Проверьте столбец администраторов для города «' + selectedCity + '» в Справочнике.';
      }

      updateLoginButtonState();
    }

    function resetAdminSelect(placeholderText) {
      const adminSelect = document.getElementById('adminSelect');
      adminSelect.innerHTML = '';
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = placeholderText;
      adminSelect.appendChild(opt);
      adminSelect.disabled = true;
    }

    function populateSelect(elementId, items, placeholder) {
      const select = document.getElementById(elementId);
      select.innerHTML = '';

      const defaultOpt = document.createElement('option');
      defaultOpt.value = '';
      defaultOpt.textContent = items.length ? placeholder : 'Список пуст';
      select.appendChild(defaultOpt);

      items.forEach(function(item) {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        select.appendChild(opt);
      });

      select.disabled = items.length === 0;
    }

    function updateLoginButtonState() {
      const city = document.getElementById('citySelect').value;
      const admin = document.getElementById('adminSelect').value;
      document.getElementById('loginBtn').disabled = !(city && admin);
    }

    function handleLogin() {
      const city = document.getElementById('citySelect').value;
      const admin = document.getElementById('adminSelect').value;
      const statusMsg = document.getElementById('statusMsg');

      if (!city || !admin) {
        statusMsg.textContent = 'Выберите город и имя администратора!';
        return;
      }

      statusMsg.textContent = '';
      currentSession = { city: city, admin: admin };

      localStorage.setItem(SESSION_KEY, JSON.stringify(currentSession));
      openMainScreen();
    }

    function openMainScreen() {
      document.getElementById('currentCityDisplay').textContent = currentSession.city;
      document.getElementById('currentAdminDisplay').textContent = currentSession.admin;

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainScreen').style.display = 'flex';
    }

    function handleLogout() {
      localStorage.removeItem(SESSION_KEY);
      currentSession = { city: '', admin: '' };

      document.getElementById('citySelect').value = '';
      resetAdminSelect('Сначала выберите город');
      updateLoginButtonState();

      document.getElementById('mainScreen').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    }
  </script>
</body>
</html>
